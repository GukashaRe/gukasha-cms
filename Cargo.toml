[package]
name = "gukasha-cms"
version = "0.1.0"
edition = "2024"
license = "AGPL-3"

[dependencies]
actix-web = {version = "4.14",default-features = false,features = ["macros"]}
anyhow = "1.0.103"
chrono = "0.4.45"
serde = { version = "1.0.228", features = ["derive"] }
sqlx = { version = "0.9.0", features = ["postgres","runtime-tokio","chrono","uuid"] }
tokio = {version = "1.52",features = ["rt-multi-thread","macros"]}
serde_json = "1.0.150"
uuid = { version = "1.23.4", features = ["v4","serde"] }
futures-util = "0.3.32"
actix-cors = "0.7.1"
toml = "1.1.3"
log = "0.4.33"
env_logger = "0.11.11"
lettre = {version = "0.11",features = ["tokio1-rustls-tls"]}

